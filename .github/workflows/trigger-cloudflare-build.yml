name: Trigger Cloudflare Pages build

# ONLY for a Pages project that Cloudflare builds itself (Workers & Pages → Connect to Git). Such a project
# rebuilds on `git push` and nothing else, so new jobs / companies / blog posts would wait for the next push.
# This calls the project's Deploy Hook on a schedule — Cloudflare then runs the normal `npm run build`
# (an incremental one: unchanged pages are reused, see DEPLOYMENT_GUIDE.md § Incremental builds).
#
# Setup: Cloudflare dashboard → the project → Settings → Builds → Deploy hooks → add a hook for branch `main`,
# copy its URL into the repository secret CF_PAGES_DEPLOY_HOOK. Without that secret this workflow does nothing.
#
# NOT needed (and pointless) if deploy-cloudflare-pages.yml does the building — that workflow has its own schedule.
on:
  schedule:
    # Every 3 hours (UTC). Odd minute on purpose: top-of-the-hour cron slots are the most congested.
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    name: Call the deploy hook
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST to the Cloudflare Pages deploy hook
        env:
          HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "CF_PAGES_DEPLOY_HOOK is not set — nothing to trigger."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK_URL" > /dev/null
          echo "Build triggered."
