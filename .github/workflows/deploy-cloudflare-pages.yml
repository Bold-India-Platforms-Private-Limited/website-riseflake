name: Deploy to Cloudflare Pages

# The site is a static export, so "content changes" (new jobs, companies, blog posts…) reach visitors by
# rebuilding and redeploying. That happens on every push to main, on a schedule, and on demand
# (Actions tab → "Deploy to Cloudflare Pages" → Run workflow — use this after publishing something urgent).
on:
  push:
    branches: [main]
  schedule:
    # Every 3 hours (UTC). Odd minute on purpose: top-of-the-hour cron slots are the most congested.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force_full_build:
        description: "Re-render every page instead of reusing the cache (see DEPLOYMENT_GUIDE.md § Incremental builds)"
        type: boolean
        default: false

# A newer run supersedes an older one — never let two deploys race each other.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Cloudflare Pages project name (create it once: Workers & Pages → Create → Pages → Direct Upload).
  # Override with a repository variable of the same name if the project is called something else.
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'riseflake-website' }}

jobs:
  build-and-deploy:
    name: Build, verify, deploy
    runs-on: ubuntu-latest
    # A COLD build (no matching incremental cache — the first deploy, or after a code change) renders every
    # page in the manifest (~2,400: active jobs/internships, hiring companies, landing pages) via live backend
    # calls: minutes with WEBSITE_ISR_SECRET set, far longer if the backend throttles it. Every build AFTER
    # that is incremental and should finish in a few minutes (see DEPLOYMENT_GUIDE.md § Incremental builds).
    # This ceiling is a safety net against a truly stuck run, not a target — `concurrency.cancel-in-progress`
    # above already prevents runs from piling up.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # >= 22.18 — the build scripts import TypeScript data files directly (native type stripping).
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Restore the previous successful deployment's output + per-page state (see
      # scripts/cf/incremental.mjs). Without this, EVERY run is a cold, full rebuild of every
      # page — restoring it is what actually makes "only render what changed" possible in CI,
      # since Actions runners start from a blank disk every time otherwise.
      #
      # restore-keys falls back to the most recent cache under this prefix (exact hit or not) —
      # a stale-but-present cache is still useful (some pages just look older than they are,
      # which the maxAgeH ceiling in scripts/cf/lib.mjs bounds); a cache miss just means this
      # run falls back to a full build, same as before this existed. No cache is ever "wrong",
      # only more or less helpful — see scripts/cf/incremental.mjs's own file-existence checks.
      - name: Restore incremental build cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: cf-site-cache-${{ github.run_id }}
          restore-keys: |
            cf-site-cache-

      # `npm run build` = resume sub-app → build manifest → next build → post-build audit.
      # The post-build step FAILS the run (nothing is deployed) if the export is over the file budget,
      # contains soft-404 pages, lost its server-rendered headings, or the backend was unhealthy.
      # NEXT_PUBLIC_* are inlined into the client bundles, so they must be the production values.
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://backend.riseflake.com/api/v2/website
          NEXT_PUBLIC_BLOG_API_URL: https://backend.riseflake.com/api/v2
          NEXT_PUBLIC_APP_BASE_URL: https://app.riseflake.com
          NEXT_PUBLIC_TRACK_404_URL: https://backend.riseflake.com/api/v2/track-404
          # Cloudflare Turnstile SITE key for the contact form — public by design (it's meant to
          # ship in client HTML), so it's inlined here like the other NEXT_PUBLIC_* values rather
          # than kept as a secret. Same key frontend-riseflake uses (VITE_TURNSTILE_SITE_KEY);
          # its allowed hostnames in the Cloudflare dashboard must include riseflake.com.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADR3vt6rRrmI-T-k
          # Lets the backend tell "our own site build" apart from a scraper (same secret the
          # backend's websiteApiHardening middleware already expects). Optional but strongly advised:
          # without it a full build can trip the rate limiter and fail the fetch-failure gate.
          WEBSITE_ISR_SECRET: ${{ secrets.WEBSITE_ISR_SECRET }}
          CF_FORCE_FULL_BUILD: ${{ github.event.inputs.force_full_build == 'true' && '1' || '' }}

      # 1) Upload to a non-production alias first…
      - name: Deploy to staging alias
        id: staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ env.CF_PAGES_PROJECT }} --branch=staging --commit-dirty=true

      # 2) …and prove that Cloudflare actually serves what we built (special-character URLs, redirects,
      #    real 404s, canonical tags) BEFORE it goes anywhere near production.
      - name: Smoke test staging deployment
        run: node scripts/cf/smoke.mjs "${{ steps.staging.outputs.deployment-url }}" --sample=300

      # 3) Promote: the same files, uploaded to the production branch. Assets are content-addressed, so
      #    this second upload is fast.
      - name: Deploy to production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      # Only reached if build + staging smoke test + production deploy all succeeded — so the
      # cache always reflects what's ACTUALLY live, never a build that merely passed locally.
      # Saved under a fresh key every run; old ones age out on their own (unused >7 days, or
      # LRU once the repo's 10 GB cache cap is hit) — never something this workflow has to manage.
      - name: Save incremental build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: cf-site-cache-${{ github.run_id }}
