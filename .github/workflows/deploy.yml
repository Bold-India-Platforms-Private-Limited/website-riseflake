name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build runs here, not on the EC2 box — that host has ~100MB of spare
      # RAM and hosts other unrelated production apps, so `next build` (which
      # can spike well past that) has no business running there.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://backend.riseflake.com/api/v2/website
          NEXT_PUBLIC_BLOG_API_URL: https://backend.riseflake.com/api/v2
          NEXT_PUBLIC_APP_BASE_URL: https://app.riseflake.com

      # `output: standalone` traces only the files server.js needs into
      # .next/standalone — but it does NOT copy public/ or .next/static
      # (Next.js deploy docs call this out explicitly). Bundle both in by
      # hand, plus the pm2 process file, then ship one tarball.
      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp ecosystem.config.js .next/standalone/ecosystem.config.js
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "release.tar.gz"
          target: "/home/ec2-user"
          overwrite: true

      - name: Release and reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            APP_DIR=/home/ec2-user/website-riseflake
            OLD_DIR=/home/ec2-user/website-riseflake.old
            NEW_DIR=/home/ec2-user/website-riseflake.new
            ARCHIVE=/home/ec2-user/release.tar.gz
            ENV_BACKUP=/home/ec2-user/website-riseflake.env.bak

            # Leftovers from a previous run that died mid-swap
            rm -rf "$NEW_DIR" "$OLD_DIR"

            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" "$ENV_BACKUP"
            elif [ ! -f "$ENV_BACKUP" ]; then
              echo "❌ Missing $APP_DIR/.env — create it once manually before the first deploy."
              exit 1
            fi

            # Extract into a fresh directory rather than wiping the live one
            # in place: riseflake-website keeps serving traffic (and writing
            # ISR/fetch-cache files) while this runs, so `rm -rf` on the live
            # directory can race with those writes and abort with "Directory
            # not empty" — which happened in production. `mv` is atomic and
            # never conflicts with the old process's open file descriptors,
            # so build the new tree beside the old one and rename into place.
            mkdir -p "$NEW_DIR"
            tar -xzf "$ARCHIVE" -C "$NEW_DIR"
            rm -f "$ARCHIVE"
            cp "$ENV_BACKUP" "$NEW_DIR/.env"

            if [ -d "$APP_DIR" ]; then
              mv "$APP_DIR" "$OLD_DIR"
            fi
            mv "$NEW_DIR" "$APP_DIR"

            cd "$APP_DIR"
            if pm2 describe riseflake-website > /dev/null 2>&1; then
              pm2 restart riseflake-website --update-env
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save

            # Safe now — the restart above has already moved the process off
            # of $OLD_DIR, so nothing is writing into it anymore.
            rm -rf "$OLD_DIR"

            echo "✅ Website deploy complete at $(date)"

      # The Cloudflare cache rule stores / and /jobs with the same s-maxage
      # (up to 1yr) the app sends, so without a purge every deploy is
      # invisible to visitors until Cloudflare's edge TTL happens to expire.
      - name: Purge Cloudflare cache
        run: |
          curl -sS --fail -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
